# Corre el bot solo, en los servidores gratuitos de GitHub.
# Cada 2 horas: analiza, compra/vende (simulado), guarda resultados y actualiza el panel.
name: Bot de inversiones

on:
  schedule:
    - cron: "17 */2 * * *"     # cada 2 horas (hora UTC)
  workflow_dispatch:            # boton "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correr un ciclo del bot
        run: python bot.py
      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "bot-inversiones"
          git config user.email "bot@users.noreply.github.com"
          git add datos docs
          git diff --cached --quiet || git commit -m "Ciclo del bot $(date -u +'%Y-%m-%d %H:%M')"
          git push
